services:
  - type: web
    name: fineract-service
    env: docker
    plan: standard
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: FINERACT_HIKARI_DRIVERCLASSNAME
        value: org.postgresql.Driver
      - key: FINERACT_HIKARI_JDBCURL
        value: jdbc:postgresql://YOUR_DB_HOST:5432/YOUR_DB_NAME
      - key: FINERACT_HIKARI_USERNAME
        value: YOUR_DB_USERNAME
      - key: FINERACT_HIKARI_PASSWORD
        value: YOUR_DB_PASSWORD
      - key: FINERACT_DEFAULT_TENANTDB
        value: default
